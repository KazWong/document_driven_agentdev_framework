image: python:3.12-bookworm

pipelines:
  pull-requests:
    '**':
      - step:
          name: Source and framework QA
          caches: [pip]
          script:
            - apt-get update && apt-get install -y build-essential cmake git ninja-build zip
            - pip install -r requirements-dev.txt
            - ./scripts/qa.sh
          artifacts:
            - docs/qa-report.md
      - step:
          name: Build development and local test images
          image: docker:27-cli
          services: [docker]
          script:
            - docker build -f docker/main/Dockerfile -t robotics-ai-agent-main:${BITBUCKET_COMMIT} .
            - docker build -f docker/generic/Dockerfile -t robotics-ai-agent-generic-test:${BITBUCKET_COMMIT} .
            - docker build -f docker/firmware/Dockerfile -t robotics-ai-agent-firmware-test:${BITBUCKET_COMMIT} .
  branches:
    main:
      - step:
          name: Release QA
          caches: [pip]
          script:
            - apt-get update && apt-get install -y build-essential cmake git ninja-build zip
            - pip install -r requirements-dev.txt
            - ./scripts/qa.sh
            - ./scripts/package.sh dist
          artifacts:
            - dist/**
  custom:
    full-validation-with-ros2-humble:
      - step:
          name: Docker and ROS 2 Humble validation
          runs-on: [self.hosted, linux.shell, robotics]
          script:
            - ./scripts/qa.sh --with-docker
            - ./bin/testctl doctor ros2-humble --execute
            - ./bin/testctl smoke ros2-humble
          artifacts:
            - docs/qa-report.md
            - .test-results/**

definitions:
  services:
    docker:
      memory: 4096

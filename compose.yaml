services:
  main-development:
    image: ${MAIN_IMAGE:?Build and select an immutable main image ID}
    init: true
    working_dir: ${FRAMEWORK_WORKSPACE:?Set the absolute controller workspace}
    user: ${CONTROLLER_UID:?Set the host user ID}:${CONTROLLER_GID:?Set the host group ID}
    group_add:
      - ${DOCKER_GID:?Set the host Docker socket group ID}
    volumes:
      - ${FRAMEWORK_WORKSPACE:?Set the controller workspace}:${FRAMEWORK_WORKSPACE}
      - ${FRAMEWORK_STATE:?Set a private controller state directory}:${FRAMEWORK_STATE}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FRAMEWORK_STATE: ${FRAMEWORK_STATE}
    command: ["sleep", "infinity"]
  generic-test:
    image: ${GENERIC_IMAGE:?Build and select an immutable generic image ID}
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /work:rw,nosuid,size=256m,mode=1777
    command: ["sleep", "infinity"]
